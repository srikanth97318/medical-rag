models:
  embedding_model: BAAI/bge-small-en-v1.5
  generation_model: Qwen/Qwen2.5-3B-Instruct
  nli_model: cross-encoder/nli-deberta-v3-small
  qag_model: null
retrieval:
  top_k: 5
  relevance_threshold: 0.25
evidence:
  supported_threshold: 0.55
  partial_threshold: 0.3
verification:
  entailment_threshold: 0.65
  contradiction_threshold: 0.65
  faithfulness_threshold: 0.6
selfcheck:
  enabled: true
  samples: 3
qag:
  enabled: true
correction:
  max_attempts: 2
generation:
  temperature: 0.1
  max_new_tokens: 256
  load_in_4bit: false
retrieval_data:
  index_dir: indexes/default
  raw_dir: data/raw
  processed_dir: data/processed
  chunk_size: 1200
  chunk_overlap: 150
  mappings: {}
benchmark:
  warmup_queries: 3
  measured_runs: 10
  synchronize_cuda: true
  output_directory: results
  seed: 42
device:
  preferred_device: auto
